# FITS header keywords
fits_keywords:
  ra_key: "RA"
  dec_key: "DEC"
  date_key: "DATE-OBS"
  exposure_key: "EXPTIME"
  jd_key: "JD"

# Astrometry parameters
astrometry:
  solve_mode: "solve"
  radius: 0.5
  quad_scales: [0, 2, 4, 6]
  cache_tolerance: 0.1
  epoch_bucket_precision: 1

# Instrument parameters
instrument:
  pixel_scale: 0.62
  gain: 0.57
  read_noise: 4.11
  saturation_level: 50000

observatory:
  observatory_code: "A84"

source_detection:
  fwhm_guess: 5.0
  threshold_sigma: 5.0
  min_area: 5
  edge_margin: 10

matching:
  isolation_radius_arcsec: 0.2
  match_constraint_arcsec: 1.0

photometry:
  mode: "asteroid"
  target_id: "Penelope"
  coords: [124.756279, 16.294038]
  coords_unit: "deg"
  filter: "V"
  aperture_method: "fixed_arcsec"
  aperture: 3.5
  annulus_inner: 7
  annulus_outer: 9
  zeropoint: "fit"
  export_reference_star_timeseries: true
  ransac_threshold_mode: "auto"
  ransac_threshold: 0.10
  ransac_threshold_grid:
    start: 0.01
    stop: 0.20
    step: 0.01
  ransac_auto_method: "inlier_knee"
  ransac_auto_min_inliers: 30
  ransac_auto_fallback_threshold: 0.10
  ransac_auto_reuse_for_sequence: true
  zp_error_method: "bootstrap"
  zp_bootstrap_iterations: 1000
  zp_bootstrap_random_seed: 42
  zp_bootstrap_min_inliers: 30
  write_analysis_summary: true
  analysis_summary_filename: "phops_analysis_summary.yaml"

paths:
  input_dir: "files"
  temp_dir: "data/temp"
  index_dir: "data/indexes"
  solve_dir: "output"
  output_photometry: "photometry.csv"
  output_astrometry: "astrometry.csv"
  output_reference_star_timeseries: "reference_star_timeseries.csv"
  file_extension: "fits"
  plot_dir: "output/plots"
  cutout_dir: "output/cutouts"

plots:
  plot_astrometry: true
  plot_image: true
  plot_light_curve: true
  image_scale: "pixel"
  light_curve_x_axis: "relative_seconds"
  light_curve_aux_panels: true
  light_curve_pdf: true
  light_curve_event_window: null
  light_curve_event_unit: "relative_seconds"

catalog: "gaiadr3.gaia_source"
